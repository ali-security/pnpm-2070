name: CI

on: [push, pull_request]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.platform }}-${{ matrix.node[0] }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        node:
          - [18, 12, 1]
          - [20, 18, 1]
          - [22, 12, 0]
        platform:
          - ubuntu-latest
          - windows-latest

    name: ${{matrix.platform}} / Node.js ${{ matrix.node[0] }}
    runs-on: ${{matrix.platform}}

    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf false
        git config --global user.name "xyz"
        git config --global user.email "x@y.z"
    - name: Checkout Commit
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        standalone: true
    - name: Setup Node
      run: pnpm env use -g ${{ join(matrix.node, '.') }}
      timeout-minutes: 1
    - name: Install npm@8
      run: pnpm add --global npm@8
      timeout-minutes: 1
    - name: pnpm install
      # supportedArchitectures pulls @reflink/reflink binaries for all platforms
      # so the bundled `pnpm` artifact contains reflink.{darwin,win32}-*.node
      run: |
        pnpm install --frozen-lockfile \
          --config.supportedArchitectures.os=linux \
          --config.supportedArchitectures.os=darwin \
          --config.supportedArchitectures.os=win32 \
          --config.supportedArchitectures.cpu=x64 \
          --config.supportedArchitectures.cpu=arm64
      timeout-minutes: 5
    # - name: Cache TypeScript and Jest
      # uses: actions/cache@v3
      # with:
        # path: |
          # packages/*/lib
          # packages/*/tsconfig.tsbuildinfo
          # privatePackages/*/lib
          # privatePackages/*/tsconfig.tsbuildinfo
          # .jest-cache
          # .verdaccio-cache
        # key: ts-jest-${{ matrix.platform }}-${{ matrix.node }}-${{ github.run_id }}
        # restore-keys: ts-jest-${{ matrix.platform }}-${{ matrix.node }}-
    - name: Build pnpm
      run: pnpm compile
      timeout-minutes: 20
    # - name: run tests (main)
    #   timeout-minutes: 60
    #   if: github.ref_name == 'main'
    #   run: pnpm run test-main
    #   env:
    #     PNPM_WORKERS: 3
    # - name: run tests (branch)
    #   timeout-minutes: 60
    #   if: github.ref_name != 'main'
    #   run: pnpm run test-branch
    #   env:
    #     PNPM_WORKERS: 3
    - name: Pack pnpm tarball
      if: matrix.platform == 'ubuntu-latest' && matrix.node[0] == 22
      working-directory: pnpm
      # publish-packed pulls in esm@3 which crashes on Node 22, so we switch
      # to Node 20 just for this step. We invoke publish-packed explicitly
      # because enablePrePostScripts=false prevents `pnpm pack` from running
      # the prepublishOnly lifecycle script.
      run: |
        pnpm env use -g 20
        pnpm exec publish-packed --prune --npm-client=pnpm --dest=dist
        pnpm pack
    - name: Upload pnpm tarball
      if: matrix.platform == 'ubuntu-latest' && matrix.node[0] == 22
      uses: actions/upload-artifact@v4
      with:
        name: pnpm-tarball
        path: pnpm/pnpm-*.tgz
        retention-days: 1
        if-no-files-found: error
