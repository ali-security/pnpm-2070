name: CI

on: [push, pull_request]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.platform }}-${{ matrix.node[0] }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        node:
          - [18, 12, 1]
          - [20, 18, 1]
          - [22, 12, 0]
        platform:
          - ubuntu-latest
          - windows-latest

    name: ${{matrix.platform}} / Node.js ${{ matrix.node[0] }}
    runs-on: ${{matrix.platform}}

    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf false
        git config --global user.name "xyz"
        git config --global user.email "x@y.z"
    - name: Checkout Commit
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        standalone: true
    - name: Setup Node
      run: pnpm env use -g ${{ join(matrix.node, '.') }}
      timeout-minutes: 1
    - name: Install npm@8
      run: pnpm add --global npm@8
      timeout-minutes: 1
    - name: pnpm install
      run: pnpm install
      timeout-minutes: 1
    # - name: Cache TypeScript and Jest
      # uses: actions/cache@v3
      # with:
        # path: |
          # packages/*/lib
          # packages/*/tsconfig.tsbuildinfo
          # privatePackages/*/lib
          # privatePackages/*/tsconfig.tsbuildinfo
          # .jest-cache
          # .verdaccio-cache
        # key: ts-jest-${{ matrix.platform }}-${{ matrix.node }}-${{ github.run_id }}
        # restore-keys: ts-jest-${{ matrix.platform }}-${{ matrix.node }}-
    - name: Build pnpm
      run: pnpm compile
      timeout-minutes: 20
    - name: run tests (main)
      timeout-minutes: 60
      if: github.ref_name == 'main'
      run: pnpm run test-main
      env:
        PNPM_WORKERS: 3
    - name: run tests (branch)
      timeout-minutes: 60
      if: github.ref_name != 'main'
      run: pnpm run test-branch
      env:
        PNPM_WORKERS: 3
    - name: Pack pnpm tarball
      if: matrix.platform == 'ubuntu-latest' && matrix.node[0] == 22
      working-directory: pnpm
      run: pnpm pack
    - name: Upload pnpm tarball
      if: matrix.platform == 'ubuntu-latest' && matrix.node[0] == 22
      uses: actions/upload-artifact@v4
      with:
        name: pnpm-tarball
        path: pnpm/pnpm-*.tgz
        retention-days: 1
        if-no-files-found: error
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.platform }}-node${{ matrix.node[0] }}
        path: '**/coverage/**'
        retention-days: 1
        if-no-files-found: warn
