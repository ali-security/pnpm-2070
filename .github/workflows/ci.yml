name: CI

on: [push, pull_request]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.platform }}-${{ matrix.node[0] }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        node:
          - [18, 12, 1]
          - [20, 18, 1]
          - [22, 12, 0]
        platform:
          - ubuntu-latest
          - windows-latest

    name: ${{matrix.platform}} / Node.js ${{ matrix.node[0] }}
    runs-on: ${{matrix.platform}}

    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf false
        git config --global user.name "xyz"
        git config --global user.email "x@y.z"
    - name: Checkout Commit
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        standalone: true
    - name: Setup Node
      run: pnpm env use -g ${{ join(matrix.node, '.') }}
      timeout-minutes: 1
    - name: Install npm@8
      run: pnpm add --global npm@8
      timeout-minutes: 1
    - name: pnpm install
      # --force pulls @reflink/reflink binaries for all platforms (matches release.yml),
      # so esbuild can copy reflink.{darwin,win32}-*.node into dist/ during `pnpm compile`.
      run: pnpm install --frozen-lockfile --force
      timeout-minutes: 5
    # - name: Cache TypeScript and Jest
      # uses: actions/cache@v3
      # with:
        # path: |
          # packages/*/lib
          # packages/*/tsconfig.tsbuildinfo
          # privatePackages/*/lib
          # privatePackages/*/tsconfig.tsbuildinfo
          # .jest-cache
          # .verdaccio-cache
        # key: ts-jest-${{ matrix.platform }}-${{ matrix.node }}-${{ github.run_id }}
        # restore-keys: ts-jest-${{ matrix.platform }}-${{ matrix.node }}-
    - name: Build pnpm
      run: pnpm compile
      timeout-minutes: 20
    # - name: run tests (main)
    #   timeout-minutes: 60
    #   if: github.ref_name == 'main'
    #   run: pnpm run test-main
    #   env:
    #     PNPM_WORKERS: 3
    # - name: run tests (branch)
    #   timeout-minutes: 60
    #   if: github.ref_name != 'main'
    #   run: pnpm run test-branch
    #   env:
    #     PNPM_WORKERS: 3
    - name: Configure time-machine registry pinned to pnpm@10.9.0 publish time
      if: matrix.platform == 'ubuntu-latest' && matrix.node[0] == 22
      env:
        VERSION: 10.9.0
      # Pin npm resolution to the moment pnpm@10.9.0 was published, so
      # publish-packed's bundled-dep closure matches what the original tarball
      # shipped (instead of drifting to "latest matching" semver on every run).
      # Written to $HOME/.npmrc because publish-packed's inner install runs
      # with --ignore-workspace and skips project-local .npmrc files.
      run: |
        set -euo pipefail
        tm_date="$(curl -fsSL "https://registry.npmjs.org/pnpm" \
          | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).time[process.env.VERSION]))')"
        echo "Pinning time-machine registry to pnpm@${VERSION} publish time: $tm_date"
        cat > "$HOME/.npmrc" <<EOF
        registry=https://time-machines-npm.sealsecurity.io/
        //time-machines-npm.sealsecurity.io/:_authToken=$tm_date
        EOF
    - name: Pack pnpm tarball
      if: matrix.platform == 'ubuntu-latest' && matrix.node[0] == 22
      # prepublishOnly == `pnpm compile && publish-packed --prune --dest=dist`.
      # With $HOME/.npmrc pinned to the time-machine above, publish-packed's
      # inner install resolves bundled deps against the registry snapshot at
      # pnpm@10.9.0's publish time — matching the original tarball's closure.
      # We then rewrite the time-machine URL out of dist/'s bookkeeping
      # (.modules.yaml, .pnpm/lock.yaml, etc.) back to registry.npmjs.org so
      # the artifact carries public-registry provenance, not the internal mirror.
      run: |
        set -euo pipefail
        pnpm --filter=pnpm run prepublishOnly
        grep -rlF 'https://time-machines-npm.sealsecurity.io/' pnpm/dist 2>/dev/null \
          | while IFS= read -r f; do
              sed -i 's#https://time-machines-npm\.sealsecurity\.io/#https://registry.npmjs.org/#g' "$f"
            done
        cd pnpm && pnpm pack
    - name: Upload pnpm tarball
      if: matrix.platform == 'ubuntu-latest' && matrix.node[0] == 22
      uses: actions/upload-artifact@v4
      with:
        name: pnpm-tarball
        path: pnpm/pnpm-*.tgz
        retention-days: 1
        if-no-files-found: error