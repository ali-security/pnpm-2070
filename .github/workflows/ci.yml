name: CI

on: [push, pull_request]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.platform }}-${{ matrix.node[0] }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        node:
          - [18, 12, 1]
          - [20, 18, 1]
          - [22, 12, 0]
        platform:
          - ubuntu-latest
          - windows-latest

    name: ${{matrix.platform}} / Node.js ${{ matrix.node[0] }}
    runs-on: ${{matrix.platform}}

    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf false
        git config --global user.name "xyz"
        git config --global user.email "x@y.z"
    - name: Checkout Commit
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        standalone: true
    - name: Setup Node
      run: pnpm env use -g ${{ join(matrix.node, '.') }}
      timeout-minutes: 1
    - name: Install npm@8
      run: pnpm add --global npm@8
      timeout-minutes: 1
    - name: pnpm install
      run: pnpm install
      timeout-minutes: 10
    - name: run tests
      # test-main minus `pnpm lint` (spellcheck/lint:meta/lint:ts) — pretest compiles
      # and prepares fixtures, then every package's jest suite runs. --no-bail so
      # all failures surface in one run; jest runs without --coverage (no coverage gate).
      # block-exotic-subdeps defaults to true in the shipped CLI; the integration tests
      # spawn the real CLI and install fixtures with exotic/registry-via-undefined subdeps,
      # so we turn it off for the test run only (production default stays true).
      timeout-minutes: 90
      run: |
        pnpm run pretest && pnpm remove-temp-dir && pnpm run --no-sort --no-bail --workspace-concurrency=1 -r _test
      env:
        PNPM_WORKERS: 3
